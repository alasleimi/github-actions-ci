name: Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  google-benchmark:
    name: Google Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ benchmark dependencies
        run: make deps-ubuntu

      - name: Build benchmark harness
        run: make

      - name: Run benchmarks as JSON
        run: make json

      - name: Upload raw benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: google-benchmark-json
          path: benchmark_result.json

      - name: Publish benchmark history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: C++ Google Benchmark
          tool: googlecpp
          output-file-path: benchmark_result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          summary-always: true
          comment-on-alert: true
          alert-threshold: 150%
          fail-on-alert: false
          max-items-in-chart: 200

